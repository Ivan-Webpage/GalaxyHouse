<div class="container">
    <div class="row hero-content">
        @if(articleData) {
        <img libImageFilter [src]="articleData.image" [title]="articleData.title" [alt]="articleData.description" />
        <div class="text-content">
            <h1 class="row">{{articleData.title}}</h1>

        </div>
        }
    </div>
    @if(articleData) {
    <div class="row meta-row">
        <span class="newType">{{articleData.newType}}</span>
        @if(articleData.newType=='最新活動'){
            <span class="create_date">活動時間：{{articleData.expiration_date}}</span>
        }@else{
            <span class="create_date">文章日期：{{articleData.create_date}}</span>
        }
        @if(articleData.newType=='最新活動'){
        <a class="sign-up-button" href="https://line.me/ti/p/@392kgxba">
            <fa-icon [icon]="faLine" class="text-yellow"></fa-icon>我要報名
        </a>
        }
    </div>
    <div class="row article-content" [innerHTML]="articleData.content"></div>
    <div class="row">
        <h6>{{articleData.writer}}</h6>
    </div>
    }
</div>

<div class="container back-black-ten" style="position: relative;">
    <div class="row" style="padding: 30px 20px 30px 20px; justify-content: center;">
        <h1 class="text-yellow title">最新消息</h1>
    </div>
    <div class="row" style="padding: 30px 20px 30px 20px; justify-content: center;">
        <div class="col-12" style="height: 500px; overflow: hidden;">
            <lib-slideshow style="width: 100%; height: 100%;" [slides]="news"></lib-slideshow>
        </div>
    </div>
</div>
